
name: Paivita sisaltoluettelot

on:
  push:
    branches:
      - main
    paths:
      - "content/uudet-tanssiteokset/**"
      - "content/uudet-projektit/**"
      - "content/luettelot/**"
      - "scripts/paivita-sisallot.py"
      - ".github/workflows/paivita-sisallot.yml"

permissions:
  contents: write

jobs:
  paivita:
    runs-on: ubuntu-latest

    steps:
      - name: Hae tiedostot
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paivita luettelot
        run: python scripts/paivita-sisallot.py

      - name: Tallenna muutokset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/luettelot/tanssiteokset.json content/luettelot/projektit.json
          if ! git diff --cached --quiet; then
            git commit -m "Paivita sisaltoluettelot"
            git push
          fi
